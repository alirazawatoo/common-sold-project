# One command brings up MySQL, the API (seeded with demo data on first start)
# and the admin UI:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockroom
      MYSQL_USER: stockroom
      MYSQL_PASSWORD: ${DB_PASSWORD:-stockroom-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./commonSold-backend
    environment:
      DB_HOST: db
      DB_NAME: stockroom
      DB_USER: stockroom
      DB_PASS: ${DB_PASSWORD:-stockroom-local}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me}
      JWT_EXPIRES_IN: 8h
    # Creates the tables and loads the demo shop only when the database is empty.
    command: sh -c "node seed/seed.js && node app.js"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./commentSold-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db-data:
